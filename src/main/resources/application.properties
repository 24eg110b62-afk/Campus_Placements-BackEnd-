server.port=${PORT:8080}

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/campus_placement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USER:${DATABASE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:root}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT secret must be at least 32 characters. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-ms=86400000
app.upload-dir=uploads
app.cors.allowed-origin=${CORS_ORIGIN:*}

# Default placement officer account (created on first start)
app.admin.email=admin@campus.edu
app.admin.password=admin123
